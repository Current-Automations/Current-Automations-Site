<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width:1050px; height:600px;
      background:#f3ede1;
      font-family:'Barlow',sans-serif;
      color:#181510;
      position:relative;
      overflow:hidden;
    }
    .display { font-family:'Barlow Condensed',sans-serif; }
    .mono { font-family:'IBM Plex Mono',monospace; }

    .card {
      width:1050px; height:600px;
      padding:56px 64px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      position:relative;
      overflow:hidden;
    }
    .watermark {
      position:absolute;
      top:50%; right:-90px;
      width:520px; height:auto;
      transform:translateY(-50%);
      opacity:0.05;
      pointer-events:none;
    }
    .card > div { position:relative; z-index:1; }
    .brandRow { display:flex; align-items:center; gap:16px; }
    .brandRow img { width:52px; height:auto; display:block; }
    .brandName {
      font-weight:600; font-size:20px; letter-spacing:0.16em;
      color:#149676; text-transform:uppercase;
    }
    .nameBlock { margin-top:38px; }
    .name { font-weight:700; font-size:64px; line-height:1; color:#181510; }
    .role {
      margin-top:10px; font-size:15px; letter-spacing:0.18em;
      color:#58524a; text-transform:uppercase; font-weight:500;
    }
    .tagline {
      margin-top:22px; font-size:23px; line-height:1.4;
      color:#3a352c; max-width:640px; font-weight:400;
    }
    .footer {
      display:flex; align-items:flex-end; justify-content:space-between;
      border-top:2px dashed rgba(28,36,48,0.24);
      padding-top:22px;
    }
    .phone { font-size:24px; font-weight:600; color:#181510; }
    .site { margin-top:4px; font-size:18px; font-weight:500; color:#149676; }
    .creds {
      text-align:right; font-size:13px; line-height:1.7; color:#58524a;
      max-width:480px; white-space:nowrap;
    }
</style>
</head>
<body>
  <div class="card">
    <img class="watermark" src="./logo/mark.svg" alt="">
    <div>
      <div class="brandRow">
        <img src="./logo/mark.svg" alt="">
        <span class="brandName">Current Automations</span>
      </div>
      <div class="nameBlock">
        <div class="name display">Jarrett Goodwin</div>
        <div class="role mono">Founder</div>
      </div>
      <div class="tagline">
        Missed calls, slow follow-up, and admin work,<br>fixed for local trades and service businesses.
      </div>
    </div>
    <div class="footer">
      <div>
        <div class="phone mono">(365) 513-7474</div>
        <div class="site mono">currentautomations.ca</div>
      </div>
      <div class="creds mono">
        B.Eng. Chemical Engineering &amp; Computer Technology, uOttawa<br>
        AI &amp; Machine Learning, Florida International University
      </div>
    </div>
  </div>
</body>
</html>
