<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Current Automations - LinkedIn Company Cover 1128x191</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #07111d;
      --teal:  #4fd0ad;
      --blue:  #2a90d6;
    }

    html, body {
      width: 1128px;
      height: 191px;
      overflow: hidden;
      background: #000;
      font-family: 'Manrope', sans-serif;
    }

    .cover {
      width: 1128px;
      height: 191px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 420px 300px at 26% 50%, rgba(79,208,173,0.13) 0%, transparent 62%),
        radial-gradient(ellipse 300px 220px at 90% 32%, rgba(42,144,214,0.09) 0%, transparent 58%),
        linear-gradient(112deg, var(--navy) 0%, #0b1929 48%, #091521 100%);
      display: flex;
      align-items: center;
    }

    .bg-waves { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    .edge-stripe {
      position: absolute; right: 0; top: 0; width: 3px; height: 100%;
      background: linear-gradient(to bottom, transparent 0%, var(--teal) 35%, var(--blue) 65%, transparent 100%);
      opacity: 0.7;
    }

    /* LinkedIn floats the square page logo over the lower-left of the cover.
       Nothing may live in this zone. No icon on this asset: the logo tile IS the mark. */
    .logo-safe { width: 232px; flex-shrink: 0; height: 100%; }

    .content { position: relative; z-index: 2; flex: 1; }

    .wordmark {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.15em;
      line-height: 1;
      background: linear-gradient(120deg, #ffffff 0%, #e8f9f5 42%, #a8edd8 72%, var(--teal) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .accent-bar {
      margin-top: 13px;
      width: 46px; height: 2px;
      background: linear-gradient(to right, var(--teal), transparent);
    }

    .tagline {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: rgba(255,255,255,0.62);
      line-height: 1.4;
    }

    .tagline em { font-style: normal; color: rgba(255,255,255,0.86); font-weight: 600; }

    .right {
      position: relative; z-index: 2; flex-shrink: 0;
      padding-right: 46px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 7px;
    }

    .right-label {
      font-size: 8.5px; font-weight: 700; letter-spacing: 0.24em;
      text-transform: uppercase; color: rgba(255,255,255,0.25);
    }

    .right-url {
      font-size: 14px; font-weight: 700; letter-spacing: 0.05em; color: var(--teal);
    }

    .right-area {
      font-size: 10px; font-weight: 500; letter-spacing: 0.09em;
      color: rgba(255,255,255,0.28); text-align: right; line-height: 1.7;
    }
  </style>
</head>
<body>

<div class="cover">

  <div class="grain"></div>

  <svg class="bg-waves" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
      <linearGradient id="wg1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#4fd0ad" stop-opacity="0"/>
        <stop offset="30%"  stop-color="#4fd0ad" stop-opacity="0.07"/>
        <stop offset="70%"  stop-color="#2a90d6" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#2a90d6" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wg2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#4fd0ad" stop-opacity="0"/>
        <stop offset="25%"  stop-color="#4fd0ad" stop-opacity="0.06"/>
        <stop offset="65%"  stop-color="#2a90d6" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#2a90d6" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wg3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#4fd0ad" stop-opacity="0"/>
        <stop offset="20%"  stop-color="#4fd0ad" stop-opacity="0.05"/>
        <stop offset="60%"  stop-color="#2a90d6" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#2a90d6" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <path d="M -140,44  C 150,44  250,74  430,74  C 610,74  700,44  960,44  C 1070,44 1110,54 1268,44"
      stroke="url(#wg1)" stroke-width="36" fill="none" stroke-linecap="round"/>
    <path d="M -140,97  C 130,97  230,127 415,127 C 600,127 690,97  945,97  C 1055,97 1100,107 1268,97"
      stroke="url(#wg2)" stroke-width="36" fill="none" stroke-linecap="round"/>
    <path d="M -140,150 C 115,150 220,180 405,180 C 590,180 675,150 930,150 C 1040,150 1095,160 1268,150"
      stroke="url(#wg3)" stroke-width="36" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="edge-stripe"></div>

  <div class="logo-safe"></div>

  <div class="content">
    <div class="wordmark">CURRENT AUTOMATIONS</div>
    <div class="accent-bar"></div>
    <p class="tagline"><em>Automation without the headache.</em></p>
  </div>

  <div class="right">
    <span class="right-label">Find us online</span>
    <span class="right-url">currentautomations.ca</span>
    <span class="right-area">
      Durham Region<br>
      Greater Toronto Area
    </span>
  </div>

</div>

</body>
</html>
